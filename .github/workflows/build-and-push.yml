name: build-and-push

on:
  push:
    branches:
      - v2.10*
      - v3*
      - my*dev
      - test*
      - dev*
    paths-ignore:
      - "**/*.md"
      - "**/.gitignore"
      - "**/LICENSE"

jobs:
  build-and-push-to-aliyun-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Work Dir
        run: |
          ls -la
          rm -rf -- ./* ./.??*
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        run: |
          DOCKER_IMAGE=${{ secrets.ALIYUN_DOCKERHUB_REGISTRY }}/wangliang181230/maxkb
          TAG_NAME="v2.10.x"
          DOCKER_IMAGE_TAGS="--tag ${DOCKER_IMAGE}:${TAG_NAME}"
          echo "buildx_args=--platform linux/amd64,linux/arm64 --memory-swap -1 \
            --build-arg DOCKER_IMAGE_TAG=${TAG_NAME} --build-arg BUILD_AT=$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M') --build-arg GITHUB_COMMIT=`git rev-parse --short HEAD` --no-cache \
            ${DOCKER_IMAGE_TAGS} ." >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_DOCKERHUB_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKERHUB_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKERHUB_TOKEN }}
      - name: Build Web
        run: |
          docker buildx build --no-cache --target web-build --output type=local,dest=./web-build-output . -f installer/Dockerfile
          rm -rf ./ui
          cp -r ./web-build-output/ui ./
          rm -rf ./web-build-output
      - name: Docker Buildx (build-and-push)
        run: |
          sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches && free -m
          docker buildx build --output "type=image,push=true" --provenance=false ${{ steps.prepare.outputs.buildx_args }} -f installer/Dockerfile

  build-and-push-to-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Work Dir
        run: |
          ls -la
          rm -rf -- ./* ./.??*
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        run: |
          DOCKER_IMAGE=wangliang181230/maxkb
          TAG_NAME="v2.10.x"
          DOCKER_IMAGE_TAGS="--tag ${DOCKER_IMAGE}:${TAG_NAME}"
          echo "buildx_args=--platform linux/amd64,linux/arm64 --memory-swap -1 \
            --build-arg DOCKER_IMAGE_TAG=${TAG_NAME} --build-arg BUILD_AT=$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M') --build-arg GITHUB_COMMIT=`git rev-parse --short HEAD` --no-cache \
            ${DOCKER_IMAGE_TAGS} ." >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Web
        run: |
          docker buildx build --no-cache --target web-build --output type=local,dest=./web-build-output . -f installer/Dockerfile
          rm -rf ./ui
          cp -r ./web-build-output/ui ./
          rm -rf ./web-build-output
      - name: Docker Buildx (build-and-push)
        run: |
          sudo sync && echo 3 | sudo tee /proc/sys/vm/drop_caches && free -m
          docker buildx build --output "type=image,push=true" ${{ steps.prepare.outputs.buildx_args }} -f installer/Dockerfile
