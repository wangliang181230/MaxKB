# Logstash 配置文件示例
# 将此文件保存为 logstash.conf 并放在 Logstash 的 pipeline 目录中

input {
  # TCP Input - 接收 MaxKB 日志
  tcp {
    port => 5000
    codec => json_lines
    type => "maxkb-log"
  }
  
  # UDP Input (可选)
  # udp {
  #   port => 5000
  #   codec => json
  #   type => "maxkb-log"
  # }
}

filter {
  # 处理 MaxKB 日志
  if [type] == "maxkb-log" {
    
    # 添加元数据
    mutate {
      add_field => { "[@metadata][source]" => "maxkb" }
    }
    
    # 根据日志级别添加标签
    if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
      mutate {
        add_tag => ["error"]
      }
    }
    
    if [log_level] == "WARNING" {
      mutate {
        add_tag => ["warning"]
      }
    }
    
    # 如果有异常信息，添加异常标签
    if [exception] {
      mutate {
        add_tag => ["exception"]
      }
    }
    
    # 解析模块名称，用于分类
    if [module] {
      mutate {
        add_field => { "module_name" => "%{module}" }
      }
    }
    
    # 地理IP解析（如果需要）
    # geoip {
    #   source => "client_ip"
    # }
    
    # 用户代理解析（如果需要）
    # useragent {
    #   source => "user_agent"
    #   target => "user_agent_parsed"
    # }
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "maxkb-logs-%{+YYYY.MM.dd}"
    
    # 如果需要认证
    # user => "elastic"
    # password => "your_password"
  }
  
  # 输出到标准输出（调试用）
  # stdout { 
  #   codec => rubydebug 
  # }
  
  # 输出到文件（备份）
  # file {
  #   path => "/var/log/logstash/maxkb-%{+YYYY-MM-dd}.log"
  #   codec => json_lines
  # }
  
  # 输出到 Kafka（可选）
  # kafka {
  #   bootstrap_servers => "localhost:9092"
  #   topic_id => "maxkb-logs"
  #   codec => json
  # }
  
  # 输出到 Redis（可选）
  # redis {
  #   host => "localhost"
  #   port => 6379
  #   data_type => "list"
  #   key => "maxkb-logs"
  # }
}
